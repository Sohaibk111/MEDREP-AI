name: One-shot v1.1 cleanup

on:
  push:
    branches:
      - v1.1-development

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      MEDREP_TODAY: 2026-09-01
    steps:
      - name: Stop after cleanup commit
        run: |
          if [ "$COMMIT_MESSAGE" = "chore: clean v1.1 seed data and date handling" ]; then
            echo "Cleanup already completed."
            exit 0
          fi

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v1.1-development
          fetch-depth: 0

      - name: Restore clean v1.0 seed data
        run: |
          git fetch origin v1.0-release --depth=1
          git checkout origin/v1.0-release -- data/medrep_crm_store.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/medrep_crm_store.json')
          data = json.loads(p.read_text())
          data.setdefault('outcomes', [])
          data.setdefault('dayEndSummaries', [])
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Remove hard-coded demo dates
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server.ts')
          s = p.read_text()
          if 'function getTodayISO()' not in s:
              marker = 'const store = loadDurableStore();'
              helper = '''function getTodayISO(): string {
            const configured = process.env.MEDREP_TODAY?.trim();
            if (configured && /^\\d{4}-\\d{2}-\\d{2}$/.test(configured)) return configured;
            return new Date().toISOString().slice(0, 10);
          }

          function formatTodayDate(iso: string): string {
            const date = new Date(`${iso}T00:00:00Z`);
            return new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }).format(date);
          }

          '''
              if marker not in s:
                  raise SystemExit('server.ts marker not found')
              s = s.replace(marker, helper + marker, 1)
          s = s.replace("const today = '2026-09-01';", 'const today = getTodayISO();')
          s = s.replace("todayDate: 'Tuesday, Sept 1, 2026',", 'todayDate: formatTodayDate(today),')
          s = s.replace("scheduledDate: scheduledDate || '2026-09-01',", 'scheduledDate: scheduledDate || getTodayISO(),')
          p.write_text(s)

          p = Path('src/services/routeEngine.ts')
          s = p.read_text()
          if 'function getTodayISO()' not in s:
              marker = 'import {'
              helper = '''function getTodayISO(): string {
            const configured = typeof process !== 'undefined' ? process.env.MEDREP_TODAY?.trim() : undefined;
            if (configured && /^\\d{4}-\\d{2}-\\d{2}$/.test(configured)) return configured;
            return new Date().toISOString().slice(0, 10);
          }

          '''
              if marker not in s:
                  raise SystemExit('routeEngine.ts import marker not found')
              s = s.replace(marker, helper + marker, 1)
          s = s.replace("targetDate: string = '2026-09-01'", 'targetDate: string = getTodayISO()')
          p.write_text(s)
          PY

      - name: Validate
        run: |
          npm install
          npx tsc --noEmit
          nohup npm run dev > /tmp/medrep-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/v1/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/v1/health > /dev/null
          npx tsx tests/api_verification_test.ts
          npx tsx tests/runtime-smoke-test.ts
          npx tsx tests/test_v1_1_milestone.ts
          npm run build

      - name: Commit cleanup and remove this workflow
        run: |
          rm -f .github/workflows/one-shot-v11-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/medrep_crm_store.json server.ts src/services/routeEngine.ts .github/workflows/one-shot-v11-cleanup.yml
          git commit -m 'chore: clean v1.1 seed data and date handling'
          git push origin HEAD:v1.1-development
