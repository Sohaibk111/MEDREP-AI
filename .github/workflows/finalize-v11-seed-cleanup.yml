name: Finalize v1.1 seed cleanup

on:
  push:
    branches:
      - v1.1-development

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v1.1-development
          fetch-depth: 0

      - name: Restore exact v1.0 seed data
        run: |
          git fetch origin v1.0-release --depth=1
          git checkout origin/v1.0-release -- data/medrep_crm_store.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/medrep_crm_store.json')
          data = json.loads(p.read_text())
          data.setdefault('outcomes', [])
          data.setdefault('dayEndSummaries', [])
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Verify seed counts and fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/medrep_crm_store.json').read_text())
          assert len(data['doctors']) == 7
          assert len(data['visits']) == 3
          assert len(data['patientOpportunities']) == 39
          assert isinstance(data.get('outcomes'), list) and len(data['outcomes']) == 0
          assert isinstance(data.get('dayEndSummaries'), list) and len(data['dayEndSummaries']) == 0
          doc1 = next(d for d in data['doctors'] if d['id'] == 'doc-1')
          assert doc1['lastVisitedDate'] == '2026-08-25'
          assert doc1['totalVisitsCount'] == 6
          assert doc1['openPatientOpportunitiesCount'] == 30
          print('Clean v1.0 seed baseline verified.')
          PY

      - name: Remove this temporary workflow and commit
        run: |
          rm -f .github/workflows/finalize-v11-seed-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/medrep_crm_store.json .github/workflows/finalize-v11-seed-cleanup.yml
          git commit -m 'chore: restore clean v1.1 seed baseline'
          git push origin HEAD:v1.1-development
